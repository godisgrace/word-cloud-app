<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f0e7">
<title>WORD CLOUD · Interactive Canvas Prototype</title>
<style>
:root{--paper:#f5f0e7;--ink:#292820;--muted:#827d70;--panel:#fffdf8;--line:#e2d9c9;--accent:#d5e5cf;--sticker:#f2d67c;--zoom:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Inter,ui-rounded,system-ui,-apple-system,"PingFang SC",sans-serif}
button,input,select{font:inherit}button{border:0;cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8aabdf;outline-offset:2px}
.app{height:100dvh;display:flex;flex-direction:column;max-width:1200px;margin:auto;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{height:68px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:950;letter-spacing:.19em;font-size:14px}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:.12em;margin-top:4px;font-weight:650}
.header-actions{display:flex;gap:8px}.icon-btn,.chip{background:#fffdf8;border:1px solid var(--line);border-radius:14px;min-width:42px;height:42px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:750}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.intro{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:4px 0}.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}.intro h1{font-size:clamp(23px,5vw,34px);letter-spacing:-.055em;line-height:1.05;margin:6px 0 0}.intro p{font-size:12px;color:var(--muted);margin:6px 0 0}.status{white-space:nowrap;border-radius:99px;padding:7px 10px;background:#e5ebdf;font-size:10px;font-weight:800}
.canvas-wrap{position:relative;flex:1;min-height:240px;border:1px solid #e3dacb;border-radius:26px;background-color:#fbf8f1;background-image:radial-gradient(#cfc4b2 0.65px,transparent .65px);background-size:15px 15px;overflow:hidden;isolation:isolate;touch-action:none;box-shadow:inset 0 1px 0 #fff}
.canvas-top{position:absolute;z-index:5;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.canvas-top>*{pointer-events:auto}
.counter{font-size:10px;font-weight:800;color:#777264;background:#fffdf0d9;border:1px solid #e7decd;border-radius:99px;padding:8px 10px;backdrop-filter:blur(8px)}
.zoom-controls{display:flex;gap:5px}.zoom-controls button{width:34px;height:34px;border-radius:11px;background:#fffdf0e8;border:1px solid #e7decd;font-size:17px}
.world{position:absolute;inset:0;transform-origin:50% 50%;transform:translate3d(0,0,0) scale(var(--zoom));perspective:900px;will-change:transform;transition:transform .08s linear}
.sticker{position:absolute;left:var(--x);top:var(--y);width:var(--w,138px);min-height:76px;padding:13px 12px 11px;border-radius:4px 5px 7px 4px;background:var(--sticker);box-shadow:0 2px 0 #66563b14,0 8px 16px #51452b22;transform:translate(-50%,-50%) rotate(var(--rot,0deg));transform-origin:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:grab;user-select:none;touch-action:none;transition:box-shadow .18s,filter .18s;overflow:visible}
.sticker:before{content:"";position:absolute;inset:5px;border:1px solid #ffffff80;pointer-events:none}
.sticker:after{content:"";position:absolute;right:0;top:0;width:0;height:0;border-style:solid;border-width:0 19px 19px 0;border-color:transparent #ffffffad transparent transparent;filter:drop-shadow(-1px 1px 1px #4d41241c)}
.sticker.selected{z-index:4;box-shadow:0 0 0 2px #292820,0 13px 24px #51452b33;cursor:grabbing}
.sticker.lifted{filter:brightness(1.03);box-shadow:0 4px 0 #66563b12,0 18px 28px #51452b38;z-index:8}
.sticker .word{font-size:var(--fs,19px);font-family:var(--font,inherit);font-weight:var(--weight,750);letter-spacing:-.035em;line-height:1.05;text-align:center;overflow-wrap:anywhere;color:var(--word-color,#292820);-webkit-text-stroke:var(--stroke,0px) var(--stroke-color,#fffdf8);paint-order:stroke fill}
.sticker .meaning{font-size:10px;line-height:1.25;text-align:center;color:#4c493e;opacity:.8;max-width:100%;overflow-wrap:anywhere}
.sticker.revealed{background:var(--panel)}.sticker.revealed .meaning{font-size:11px;opacity:1}.sticker.revealed .word{font-size:calc(var(--fs,19px)*.86)}
.sticker .tape{position:absolute;width:39px;height:12px;top:-5px;left:calc(50% - 19px);background:#fffdf0b5;transform:rotate(-4deg);box-shadow:0 1px 2px #51452b10}
.sticker.torn{animation:tear-away .3s ease-in forwards;pointer-events:none}@keyframes tear-away{to{transform:translate(-50%,-130%) rotate(18deg) scale(.7);opacity:0;filter:blur(2px)}}
#tearZone{position:absolute;z-index:6;left:50%;bottom:14px;transform:translateX(-50%) translateY(15px);opacity:0;pointer-events:none;border:1px dashed #b8a38a;border-radius:15px;background:#fffaf1e8;padding:10px 15px;font-size:11px;font-weight:850;transition:.18s;backdrop-filter:blur(8px)}
#tearZone.visible{opacity:1;transform:translateX(-50%) translateY(0)}#tearZone.over{background:#f1d9d4;border-color:#bd8075;scale:1.04}
.empty-note{position:absolute;inset:auto 18px 19%;text-align:center;font-size:11px;color:#9b9384;pointer-events:none}
.toolbar{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:2px 0 5px;scrollbar-width:none;flex:none}.toolbar::-webkit-scrollbar{display:none}.tool{height:45px;min-width:45px;padding:0 13px;border-radius:15px;border:1px solid var(--line);background:#fffdf8;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:800;white-space:nowrap}.tool.active,.tool.primary{background:var(--ink);border-color:var(--ink);color:#fffdf8}.tool .sym{font-size:17px}.toolbar .spacer{flex:1;min-width:0}
.hint{font-size:10px;color:var(--muted);text-align:center;line-height:1.4;padding:0 0 7px}
.scrim{position:fixed;inset:0;background:#2928203b;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:21;left:0;right:0;bottom:0;margin:auto;max-width:600px;max-height:86dvh;overflow:auto;background:#fffdf8;border-radius:24px 24px 0 0;padding:19px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #29282022;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translateY(0)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.sheet-head h2{margin:0;font-size:17px;letter-spacing:-.03em}.close{width:34px;height:34px;border-radius:50%;background:#f1ede5;font-size:20px}
.field{display:flex;flex-direction:column;gap:8px;margin:14px 0}.field label{font-size:11px;font-weight:850;color:#696355;display:flex;justify-content:space-between;gap:10px}.field input[type=text],.field select{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;color:var(--ink)}.field input[type=range]{width:100%;accent-color:#292820}.options{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:33px;height:33px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #d8d0c2;position:relative}.swatch.active:after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-weight:900}.toggle{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee7db;font-size:12px;font-weight:750}.toggle input{width:19px;height:19px;accent-color:#292820}.sheet-actions{display:flex;gap:8px;margin-top:16px}.sheet-actions button{flex:1;height:44px;border-radius:13px;font-weight:850}.solid{background:var(--ink);color:white}.soft{background:#f1ede5}
.toast{position:fixed;z-index:30;left:50%;bottom:100px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#292820;color:white;padding:10px 14px;border-radius:99px;font-size:11px;font-weight:750;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){.app{padding-left:28px;padding-right:28px}.canvas-wrap{min-height:400px}.sheet{bottom:18px;border-radius:24px}.sticker{min-height:88px}.hint{padding-bottom:12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">WORD CLOUD<small>AN INTERACTIVE VOCABULARY CANVAS</small></div><div class="header-actions"><button class="icon-btn" id="gyroBtn" aria-label="开启设备姿态控制" title="设备姿态">◉ <span style="font-size:11px">姿态</span></button><button class="icon-btn" id="styleBtn" aria-label="自定义贴纸和字体" title="贴纸样式">Aa</button></div></header>
<main>
<section class="intro"><div><div class="eyebrow">YOUR WORD SPACE</div><h1>让单词，自由一点。</h1><p>倾斜 · 缩放 · 揭开 · 重新摆放</p></div><div class="status" id="modeStatus">自由画布</div></section>
<section class="canvas-wrap" id="canvas" aria-label="交互式词汇画布">
<div class="canvas-top"><div class="counter" id="wordCounter">06 WORD STICKERS</div><div class="zoom-controls"><button id="zoomOut" aria-label="缩小">−</button><button id="zoomReset" aria-label="重置缩放" style="font-size:10px;width:45px">100%</button><button id="zoomIn" aria-label="放大">＋</button></div></div>
<div class="world" id="world">
<div class="sticker" data-id="enhance" style="--x:23%;--y:28%;--w:132px;--rot:-9deg;--sticker:#f2d67c"><span class="tape"></span><span class="word">enhance</span><span class="meaning">提高；增强</span></div>
<div class="sticker" data-id="resilient" style="--x:69%;--y:25%;--w:132px;--rot:7deg;--sticker:#cfe0c6"><span class="tape"></span><span class="word">resilient</span><span class="meaning">有韧性的</span></div>
<div class="sticker" data-id="uncertainty" style="--x:48%;--y:49%;--w:150px;--rot:3deg;--sticker:#e6d6e7"><span class="tape"></span><span class="word">uncertainty</span><span class="meaning">不确定性；犹豫</span></div>
<div class="sticker" data-id="identify" style="--x:23%;--y:72%;--w:126px;--rot:5deg;--sticker:#f2c8bd"><span class="tape"></span><span class="word">identify</span><span class="meaning">识别；确认身份</span></div>
<div class="sticker" data-id="curiosity" style="--x:73%;--y:65%;--w:128px;--rot:-6deg;--sticker:#c9ddeb"><span class="tape"></span><span class="word">curiosity</span><span class="meaning">好奇心</span></div>
<div class="sticker" data-id="subtle" style="--x:49%;--y:83%;--w:112px;--rot:-3deg;--sticker:#f1dfc6"><span class="tape"></span><span class="word">subtle</span><span class="meaning">微妙的；细微的</span></div>
</div>
<div id="tearZone">✂ 松手即可撕下贴纸 · 可撤销</div><div class="empty-note" id="emptyNote" hidden>画布空空的，去词库添加一些单词吧。</div>
</section>
<nav class="toolbar" aria-label="画布工具"><button class="tool active" id="selectTool"><span class="sym">↖</span>选择</button><button class="tool" id="revealTool"><span class="sym">⌁</span>揭开释义</button><button class="tool" id="dragTool"><span class="sym">✋</span>整理贴纸</button><button class="tool" id="tearTool"><span class="sym">✂</span>撕下</button><span class="spacer"></span><button class="tool" id="addWord"><span class="sym">＋</span>加单词</button></nav>
<div class="hint" id="hint">点选单词 · 拖动可整理 · 长按边角揭开 · 拖向撕下区域可移除</div>
</main>
</div>
<div class="scrim" id="scrim"></div>
<section class="sheet" id="styleSheet" role="dialog" aria-modal="true" aria-labelledby="styleTitle">
<div class="sheet-head"><h2 id="styleTitle">贴纸工作室</h2><button class="close" data-close aria-label="关闭">×</button></div>
<div class="field"><label>贴纸颜色 <span id="colorName">奶油黄</span></label><div class="options" id="colors"><button class="swatch active" data-color="#f2d67c" style="background:#f2d67c" aria-label="奶油黄"></button><button class="swatch" data-color="#f2c8bd" style="background:#f2c8bd" aria-label="蜜桃粉"></button><button class="swatch" data-color="#c9ddeb" style="background:#c9ddeb" aria-label="雾霾蓝"></button><button class="swatch" data-color="#cfe0c6" style="background:#cfe0c6" aria-label="鼠尾草绿"></button><button class="swatch" data-color="#e6d6e7" style="background:#e6d6e7" aria-label="灰紫"></button><button class="swatch" data-color="#fffdf8" style="background:#fffdf8" aria-label="纸白"></button><button class="swatch" data-color="#292820" style="background:#292820" aria-label="墨黑"></button></div></div>
<div class="field"><label for="fontFamily">字体</label><select id="fontFamily"><option value="inherit">系统圆体</option><option value="Georgia,serif">Georgia · 衬线</option><option value="Arial,sans-serif">Arial · 无衬线</option><option value="monospace">等宽字体</option><option value="'Trebuchet MS',sans-serif">Trebuchet · 手写感</option></select></div>
<div class="field"><label for="fontSize">字体大小 <span id="fontSizeValue">19 px</span></label><input id="fontSize" type="range" min="12" max="36" value="19"></div>
<div class="field"><label for="fontWeight">字重 <span id="fontWeightValue">加粗</span></label><input id="fontWeight" type="range" min="400" max="900" step="100" value="750"></div>
<div class="toggle"><span>字体加粗</span><input id="boldToggle" type="checkbox" checked></div>
<div class="toggle"><span>文字描边</span><input id="outlineToggle" type="checkbox"></div>
<div class="field" id="outlineField" hidden><label for="outlineSize">描边粗细 <span id="outlineSizeValue">1 px</span></label><input id="outlineSize" type="range" min="0.5" max="3" step="0.5" value="1"><label for="outlineColor">描边颜色</label><select id="outlineColor"><option value="#fffdf8">纸白</option><option value="#292820">墨黑</option><option value="#e86e5d">珊瑚红</option><option value="#6c7cba">雾蓝紫</option></select></div>
<div class="field"><label for="textColor">文字颜色</label><select id="textColor"><option value="#292820">墨黑</option><option value="#fffdf8">纸白</option><option value="#9d4238">砖红</option><option value="#455d76">深蓝灰</option></select></div>
<div class="field"><label for="stickerWidth">贴纸宽度 <span id="stickerWidthValue">138 px</span></label><input id="stickerWidth" type="range" min="90" max="220" value="138"></div>
<div class="sheet-actions"><button class="soft" id="resetStyle">恢复默认</button><button class="solid" id="applyStyle">应用到选中贴纸</button></div>
</section>
<section class="sheet" id="wordSheet" role="dialog" aria-modal="true" aria-labelledby="wordTitle">
<div class="sheet-head"><h2 id="wordTitle">添加单词贴纸</h2><button class="close" data-close aria-label="关闭">×</button></div>
<div class="field"><label for="newWord">英文单词或短语</label><input id="newWord" type="text" maxlength="60" placeholder="例如：take into account"></div>
<div class="field"><label for="newMeaning">中文释义（可选）</label><input id="newMeaning" type="text" maxlength="100" placeholder="例如：考虑到"></div>
<div class="sheet-actions"><button class="soft" data-close>取消</button><button class="solid" id="createWord">创建贴纸</button></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
var canvas=document.getElementById("canvas"),world=document.getElementById("world"),stickers=Array.from(document.querySelectorAll(".sticker")),tearZone=document.getElementById("tearZone"),toastEl=document.getElementById("toast"),scrim=document.getElementById("scrim"),styleSheet=document.getElementById("styleSheet"),wordSheet=document.getElementById("wordSheet");
var state={zoom:1,panX:0,panY:0,tiltX:0,tiltY:0,mode:"select",selected:null,gyro:false,custom:{}},gesture=null,pressTimer=null,longPressed=false,toastTimer=null;
var palettes={"#f2d67c":"奶油黄","#f2c8bd":"蜜桃粉","#c9ddeb":"雾霾蓝","#cfe0c6":"鼠尾草绿","#e6d6e7":"灰紫","#fffdf8":"纸白","#292820":"墨黑"};
function showToast(s){toastEl.textContent=s;toastEl.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastEl.classList.remove("show")},2100)}
function save(){try{var data={zoom:state.zoom,panX:state.panX,panY:state.panY,custom:state.custom,words:stickers.map(function(el){return{id:el.dataset.id,x:el.style.getPropertyValue("--x"),y:el.style.getPropertyValue("--y"),rot:el.style.getPropertyValue("--rot"),w:el.style.getPropertyValue("--w"),sticker:el.style.getPropertyValue("--sticker"),word:el.querySelector(".word").textContent,meaning:el.querySelector(".meaning").textContent,revealed:el.classList.contains("revealed"),style:styleOf(el)}})};localStorage.setItem("wc-prototype-v1",JSON.stringify(data))}catch(e){}}
function styleOf(el){var c=getComputedStyle(el);return{font:c.getPropertyValue("--font").trim(),fs:c.getPropertyValue("--fs").trim(),weight:c.getPropertyValue("--weight").trim(),stroke:c.getPropertyValue("--stroke").trim(),strokeColor:c.getPropertyValue("--stroke-color").trim(),wordColor:c.getPropertyValue("--word-color").trim()}}
function renderWorld(){world.style.setProperty("--zoom",state.zoom);world.style.transform="translate3d("+state.panX+"px,"+state.panY+"px,0) scale("+state.zoom+") rotateX("+state.tiltX+"deg) rotateY("+state.tiltY+"deg)";document.getElementById("zoomReset").textContent=Math.round(state.zoom*100)+"%"}
function select(el){stickers.forEach(function(s){s.classList.toggle("selected",s===el)});state.selected=el;document.getElementById("modeStatus").textContent=el?"已选中 · "+el.dataset.id:"自由画布";if(el)loadStyle(el)}
function loadStyle(el){if(!el)return;var c=getComputedStyle(el);document.getElementById("fontFamily").value=c.getPropertyValue("--font").trim()||"inherit";document.getElementById("fontSize").value=parseInt(c.getPropertyValue("--fs"))||19;document.getElementById("fontSizeValue").textContent=document.getElementById("fontSize").value+" px";var w=parseInt(c.getPropertyValue("--weight"))||750;document.getElementById("fontWeight").value=w;document.getElementById("fontWeightValue").textContent=w>=700?"加粗":w>=500?"中等":"常规";document.getElementById("boldToggle").checked=w>=700;var st=parseFloat(c.getPropertyValue("--stroke"))||0;document.getElementById("outlineToggle").checked=st>0;document.getElementById("outlineField").hidden=st<=0;document.getElementById("outlineSize").value=st||1;document.getElementById("outlineSizeValue").textContent=(st||1)+" px";document.getElementById("outlineColor").value=c.getPropertyValue("--stroke-color").trim()||"#fffdf8";document.getElementById("textColor").value=c.getPropertyValue("--word-color").trim()||"#292820";document.getElementById("stickerWidth").value=parseInt(c.getPropertyValue("--w"))||138;document.getElementById("stickerWidthValue").textContent=document.getElementById("stickerWidth").value+" px";var color=c.getPropertyValue("--sticker").trim()||"#f2d67c";document.querySelectorAll(".swatch").forEach(function(b){b.classList.toggle("active",b.dataset.color===color)});document.getElementById("colorName").textContent=palettes[color]||"自定义"}
function applyStyle(){var el=state.selected;if(!el){showToast("请先选择一张贴纸");return}var bold=document.getElementById("boldToggle").checked,outline=document.getElementById("outlineToggle").checked,sz=document.getElementById("fontSize").value,weight=bold?Math.max(700,Number(document.getElementById("fontWeight").value)):Math.min(600,Number(document.getElementById("fontWeight").value)),stroke=outline?document.getElementById("outlineSize").value:0;el.style.setProperty("--font",document.getElementById("fontFamily").value);el.style.setProperty("--fs",sz+"px");el.style.setProperty("--weight",weight);el.style.setProperty("--stroke",stroke+"px");el.style.setProperty("--stroke-color",document.getElementById("outlineColor").value);el.style.setProperty("--word-color",document.getElementById("textColor").value);el.style.setProperty("--w",document.getElementById("stickerWidth").value+"px");var color=document.querySelector(".swatch.active");if(color)el.style.setProperty("--sticker",color.dataset.color);save();showToast("贴纸样式已应用")}
function setMode(mode){state.mode=mode;document.querySelectorAll(".tool").forEach(function(b){b.classList.remove("active")});var ids={select:"selectTool",reveal:"revealTool",drag:"dragTool",tear:"tearTool"};document.getElementById(ids[mode]).classList.add("active");document.getElementById("hint").textContent={select:"点选单词 · 拖动可整理 · 长按边角揭开 · 拖向撕下区域可移除",reveal:"长按贴纸的折角，或点选后点击「揭开释义」查看背面内容",drag:"拖动单词重新摆放 · 松手后自动保存位置",tear:"将贴纸拖向底部的撕下区域 · 操作后可撤销"}[mode];document.getElementById("modeStatus").textContent={select:"自由画布",reveal:"揭开模式",drag:"整理模式",tear:"撕下模式"};if(mode==="tear")showToast("拖动贴纸至底部撕下区域")}
function openSheet(sheet){scrim.classList.add("open");sheet.classList.add("open");sheet.setAttribute("aria-hidden","false");if(sheet===styleSheet)loadStyle(state.selected)}
function closeSheets(){scrim.classList.remove("open");[styleSheet,wordSheet].forEach(function(s){s.classList.remove("open");s.setAttribute("aria-hidden","true")})}
function point(e){var r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function worldPoint(p){return{x:(p.x-canvas.clientWidth/2-state.panX)/state.zoom+canvas.clientWidth/2,y:(p.y-canvas.clientHeight/2-state.panY)/state.zoom+canvas.clientHeight/2}}
function setStickerPosition(el,x,y){el.style.setProperty("--x",(x/canvas.clientWidth*100)+"%");el.style.setProperty("--y",(y/canvas.clientHeight*100)+"%")}
function startPress(e,el){longPressed=false;clearTimeout(pressTimer);pressTimer=setTimeout(function(){longPressed=true;el.classList.add("lifted");if(state.mode==="tear"){tearZone.classList.add("visible")}else{el.classList.toggle("revealed");showToast(el.classList.contains("revealed")?"已揭开释义":"已合上贴纸");save()}},480)}
function tearSticker(el){var old={el:el,parent:el.parentNode,next:el.nextSibling,style:el.getAttribute("style"),classes:el.className};el.classList.add("torn");setTimeout(function(){el.remove();updateCounter();save();var undo=document.createElement("button");undo.className="tool";undo.textContent="↶ 撤销撕下";undo.id="undoTear";document.querySelector(".toolbar").appendChild(undo);undo.addEventListener("click",function(){old.parent.insertBefore(old.el,old.next);old.el.setAttribute("style",old.style||"");old.el.className=old.classes;undo.remove();stickers=Array.from(document.querySelectorAll(".sticker"));bindSticker(old.el);updateCounter();save();showToast("已恢复贴纸")},{once:true});showToast("贴纸已撕下，可撤销")},280)}
function bindSticker(el){el.addEventListener("pointerdown",function(e){if(e.button!==undefined&&e.button!==0)return;e.stopPropagation();select(el);var p=point(e),wp=worldPoint(p);gesture={kind:"sticker",el:el,start:p,last:p,origin:wp,origStyle:{x:el.style.getPropertyValue("--x"),y:el.style.getPropertyValue("--y")},moved:false};try{el.setPointerCapture(e.pointerId)}catch(_){}startPress(e,el)});el.addEventListener("pointermove",function(e){if(!gesture||gesture.el!==el)return;var p=point(e),dx=p.x-gesture.start.x,dy=p.y-gesture.start.y;if(Math.abs(dx)+Math.abs(dy)>8){gesture.moved=true;clearTimeout(pressTimer);if(state.mode==="drag"||state.mode==="tear"||state.mode==="select"){el.classList.add("lifted");setStickerPosition(el,gesture.origin.x+dx/state.zoom,gesture.origin.y+dy/state.zoom)}if(state.mode==="tear"||p.y>canvas.clientHeight-70)tearZone.classList.add("visible");var z=tearZone.getBoundingClientRect();tearZone.classList.toggle("over",p.clientY>z.top-10&&p.clientY<z.bottom+20)}gesture.last=p});function end(e){clearTimeout(pressTimer);el.classList.remove("lifted");tearZone.classList.remove("visible","over");if(gesture&&gesture.el===el){var p=point(e),z=tearZone.getBoundingClientRect();if(gesture.moved&&state.mode==="tear"&&p.y>canvas.clientHeight-65){tearSticker(el)}else if(gesture.moved){save()}else if(!longPressed&&state.mode==="reveal"){el.classList.toggle("revealed");save()}gesture=null}longPressed=false}el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);el.addEventListener("contextmenu",function(e){e.preventDefault();el.classList.toggle("revealed");save()})}
stickers.forEach(bindSticker);
canvas.addEventListener("pointerdown",function(e){if(e.target.closest(".sticker")||e.target.closest(".canvas-top"))return;gesture={kind:"pan",start:point(e),origin:{x:state.panX,y:state.panY},moved:false};try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener("pointermove",function(e){if(!gesture||gesture.kind!=="pan")return;var p=point(e);if(Math.abs(p.x-gesture.start.x)+Math.abs(p.y-gesture.start.y)>4)gesture.moved=true;if(gesture.moved){state.panX=gesture.origin.x+p.x-gesture.start.x;state.panY=gesture.origin.y+p.y-gesture.start.y;renderWorld()}});
canvas.addEventListener("pointerup",function(){if(gesture&&gesture.kind==="pan")gesture=null});canvas.addEventListener("pointercancel",function(){gesture=null});
var pinch=null;canvas.addEventListener("touchstart",function(e){if(e.touches.length===2){pinch={distance:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),zoom:state.zoom};clearTimeout(pressTimer)}},{passive:true});canvas.addEventListener("touchmove",function(e){if(e.touches.length===2&&pinch){e.preventDefault();var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);state.zoom=Math.max(.55,Math.min(1.8,pinch.zoom*d/pinch.distance));renderWorld()}},{passive:false});canvas.addEventListener("touchend",function(e){if(e.touches.length<2&&pinch){pinch=null;save()}});
document.getElementById("zoomIn").addEventListener("click",function(){state.zoom=Math.min(1.8,state.zoom+.1);renderWorld();save()});document.getElementById("zoomOut").addEventListener("click",function(){state.zoom=Math.max(.55,state.zoom-.1);renderWorld();save()});document.getElementById("zoomReset").addEventListener("click",function(){state.zoom=1;state.panX=state.panY=state.tiltX=state.tiltY=0;renderWorld();save();showToast("画布视图已重置")});

document.getElementById("styleBtn").onclick=function(){openSheet(styleSheet)};document.getElementById("addWord").onclick=function(){openSheet(wordSheet);setTimeout(function(){document.getElementById("newWord").focus()},250)};document.getElementById("applyStyle").onclick=applyStyle;scrim.onclick=closeSheets;document.querySelectorAll("[data-close]").forEach(function(b){b.onclick=closeSheets});

document.getElementById("fontSize").oninput=function(){document.getElementById("fontSizeValue").textContent=this.value+" px"};document.getElementById("fontWeight").oninput=function(){document.getElementById("fontWeightValue").textContent=this.value>=700?"加粗":this.value>=500?"中等":"常规"};document.getElementById("outlineSize").oninput=function(){document.getElementById("outlineSizeValue").textContent=this.value+" px"};document.getElementById("stickerWidth").oninput=function(){document.getElementById("stickerWidthValue").textContent=this.value+" px"};document.getElementById("outlineToggle").onchange=function(){document.getElementById("outlineField").hidden=!this.checked};

document.getElementById("resetStyle").onclick=function(){if(!state.selected){showToast("请先选择一张贴纸");return}["--font","--fs","--weight","--stroke","--stroke-color","--word-color","--w"].forEach(function(k){state.selected.style.removeProperty(k)});state.selected.style.setProperty("--sticker","#f2d67c");loadStyle(state.selected);save();showToast("已恢复默认样式")};
document.getElementById("createWord").onclick=function(){var w=document.getElementById("newWord").value.trim(),m=document.getElementById("newMeaning").value.trim();if(!w){showToast("请先输入单词或短语");return}var el=document.createElement("div");el.className="sticker";el.dataset.id="word-"+Date.now();el.style.cssText="--x:"+((25+Math.random()*50).toFixed(1))+"%;--y:"+((28+Math.random()*45).toFixed(1))+"%;--w:138px;--rot:"+((Math.random()*14-7).toFixed(1))+"deg;--sticker:#f2d67c";el.innerHTML='<span class="tape"></span><span class="word"></span><span class="meaning"></span>';el.querySelector(".word").textContent=w;el.querySelector(".meaning").textContent=m||"点击揭开释义";world.appendChild(el);bindSticker(el);stickers=Array.from(document.querySelectorAll(".sticker"));select(el);updateCounter();closeSheets();save();document.getElementById("newWord").value="";document.getElementById("newMeaning").value="";showToast("新贴纸已加入画布")};
function updateCounter(){document.getElementById("wordCounter").textContent=stickers.length.toString().padStart(2,"0")+" WORD STICKERS";document.getElementById("emptyNote").hidden=stickers.length!==0}
var gyroBtn=document.getElementById("gyroBtn"),lastGamma=0,lastBeta=0;
function orientation(e){if(e.gamma==null||e.beta==null)return;var gamma=Math.max(-25,Math.min(25,e.gamma)),beta=Math.max(-25,Math.min(25,e.beta-35));state.tiltY=gamma*.28;state.tiltX=-beta*.22;renderWorld()}
async function enableGyro(){try{if(typeof DeviceOrientationEvent==="undefined"){showToast("此设备或浏览器不支持姿态传感器");return}if(typeof DeviceOrientationEvent.requestPermission==="function"){var permission=await DeviceOrientationEvent.requestPermission();if(permission!=="granted"){showToast("未获得设备姿态权限");return}}window.addEventListener("deviceorientation",orientation,true);state.gyro=true;gyroBtn.classList.add("active");gyroBtn.innerHTML="◉ <span style='font-size:11px'>已开启</span>";showToast("设备姿态已开启 · 轻轻倾斜手机")}catch(e){showToast("无法开启姿态控制，请检查浏览器权限")}}
gyroBtn.onclick=function(){if(state.gyro){window.removeEventListener("deviceorientation",orientation,true);state.gyro=false;state.tiltX=state.tiltY=0;renderWorld();gyroBtn.classList.remove("active");gyroBtn.innerHTML="◉ <span style='font-size:11px'>姿态</span>";showToast("设备姿态已关闭")}else enableGyro()};
function restore(){try{var raw=localStorage.getItem("wc-prototype-v1");if(!raw)return;var d=JSON.parse(raw);state.zoom=d.zoom||1;state.panX=d.panX||0;state.panY=d.panY||0;(d.words||[]).forEach(function(w){var el=stickers.find(function(x){return x.dataset.id===w.id});if(!el){el=document.createElement("div");el.className="sticker";el.dataset.id=w.id;el.innerHTML='<span class="tape"></span><span class="word"></span><span class="meaning"></span>';el.querySelector(".word").textContent=w.word;el.querySelector(".meaning").textContent=w.meaning;world.appendChild(el);bindSticker(el)}el.style.setProperty("--x",w.x);el.style.setProperty("--y",w.y);el.style.setProperty("--rot",w.rot);el.style.setProperty("--w",w.w);el.style.setProperty("--sticker",w.sticker);el.classList.toggle("revealed",!!w.revealed);var st=w.style||{};Object.keys(st).forEach(function(k){var css={"font":"--font","fs":"--fs","weight":"--weight","stroke":"--stroke","strokeColor":"--stroke-color","wordColor":"--word-color"}[k];if(css&&st[k])el.style.setProperty(css,st[k])})});stickers=Array.from(document.querySelectorAll(".sticker"));renderWorld();updateCounter()}catch(e){}}
restore();renderWorld();updateCounter();setMode("select");document.querySelectorAll(".sheet").forEach(function(s){s.setAttribute("aria-hidden","true")});window.addEventListener("keydown",function(e){if(e.key==="Escape")closeSheets();if((e.key==="+"||e.key==="=")&&!styleSheet.classList.contains("open")){state.zoom=Math.min(1.8,state.zoom+.1);renderWorld()}if(e.key==="-"&&!styleSheet.classList.contains("open")){state.zoom=Math.max(.55,state.zoom-.1);renderWorld()}});window.addEventListener("beforeunload",save);
